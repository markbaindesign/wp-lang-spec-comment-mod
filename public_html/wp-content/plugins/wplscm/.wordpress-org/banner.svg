<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1544" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B4B5A"/>
      <stop offset="1" stop-color="#0E2F3C"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3F2"/>
    </linearGradient>
    <font-face font-family="DejaVu Sans"/>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>

  <!-- faint decorative globe rings, right side, purely atmospheric -->
  <g opacity="0.08" stroke="#FFFFFF" fill="none" stroke-width="4">
    <circle cx="1330" cy="250" r="230"/>
    <ellipse cx="1330" cy="250" rx="95" ry="230"/>
    <line x1="1100" y1="250" x2="1560" y2="250"/>
    <line x1="1130" y1="140" x2="1530" y2="140"/>
    <line x1="1130" y1="360" x2="1530" y2="360"/>
  </g>

  <!-- icon mark, left -->
  <g transform="translate(120,110)">
    <path d="M20 60
             a20 20 0 0 1 20 -20
             h230
             a20 20 0 0 1 20 20
             v150
             a20 20 0 0 1 -20 20
             h-165
             l-55 50
             v-50
             h-10
             a20 20 0 0 1 -20 -20
             z"
          fill="url(#bubble)"/>
    <g transform="translate(140,160)">
      <circle r="62" fill="none" stroke="#1B4B5A" stroke-width="10"/>
      <ellipse rx="27" ry="62" fill="none" stroke="#1B4B5A" stroke-width="8"/>
      <line x1="-62" y1="0" x2="62" y2="0" stroke="#1B4B5A" stroke-width="8"/>
      <line x1="-54" y1="-31" x2="54" y2="-31" stroke="#1B4B5A" stroke-width="8"/>
      <line x1="-54" y1="31" x2="54" y2="31" stroke="#1B4B5A" stroke-width="8"/>
    </g>
    <circle cx="245" cy="248" r="46" fill="#2FA98C"/>
    <path d="M223 248 l16 16 l32 -34" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title copy -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="500" y="235" font-size="58" font-weight="700">Multilingual</text>
    <text x="500" y="300" font-size="58" font-weight="700">Comment Moderation</text>
    <text x="503" y="350" font-size="28" fill="#9FCFC7">Per-language moderation email routing for WPML sites</text>
  </g>
</svg>
