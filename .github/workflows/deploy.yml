name: Deploy to WordPress.org

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin release directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/wplscm"
          rsync -av \
            --exclude-from="$GITHUB_WORKSPACE/public_html/wp-content/plugins/wplscm/.distignore" \
            "$GITHUB_WORKSPACE/public_html/wp-content/plugins/wplscm/" \
            "$GITHUB_WORKSPACE/build/wplscm/"

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: language-specific-comment-moderation
          BUILD_DIR: build/wplscm
          ASSETS_DIR: public_html/wp-content/plugins/wplscm/.wordpress-org

      - name: Zip release asset
        run: cd build && zip -r ../wplscm.zip wplscm

      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wplscm.zip
